<style>

.wrap{max-width:1100px;margin:auto;padding:0 18px}
.bar{display:flex;align-items:center;gap:18px;height:60px}

.nl{background:none;border:0;padding:8px 13px;border-radius:9px;color:var(--mu);font-weight:600;font-size:14px}

.ch:hover{border-color:var(--pu)}.ch.sel{border-color:var(--pu);background:#7c5cf01c}.ch.ok{border-color:var(--gr);background:#4ade8014}.ch.no{border-color:var(--rd);background:#f8717114}
.pg{height:6px;background:var(--p2);border-radius:6px;overflow:hidden}.pg span{display:block;height:100%;background:linear-gradient(90deg,var(--pu2),var(--pu))}

.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mu)}

.pie{width:140px;height:140px;border-radius:50%;margin:10px auto}
.chips2{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.fc{background:var(--p1);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:13px}.fc.on{background:#7c5cf033;border-color:var(--pu)}
.ft{font-size:12px;color:var(--mu);text-align:center;padding:24px 0}

.nav{display:none;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:#1b1b24;padding:10px 18px;border-bottom:1px solid var(--bd)}.nav.open{display:flex}
.dd{position:static;margin-top:6px;width:100%}.two{grid-template-columns:1fr}.bar{position:relative}.chips{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

const byId=id=>M.find(m=>m.id===id);
const nums=s=>{const a=String(s||"").split(/[\s,;]+/).filter(Boolean).map(Number);if(!a.length||a.some(x=>!isFinite(x)))throw Error("Enter valid numbers separated by commas.");return a};
const F={ // solver fields
 clock:[["hour","Hour (0–23)","15"],["minute","Minute (0–59)","20"]],
 calendar:[["year","Year","2026"],["month","Month (1–12)","10"],["day","Day","23"]],
 pattern:[["seq","Sequence (3+ numbers)","2, 5, 8, 11","t"]],
 pie:[["vals","Category values","25, 35, 40","t"]],
 scatter:[["vals","x,y pairs in order","1,2,2,4,3,6,4,8","t"]],
 histogram:[["vals","Dataset values","12, 15, 22, 25, 31, 38, 41","t"]],
 missing:[["total","Required total","100"],["known","Known values","20, 25, 30","t"]]};
["table","barline","caselet"].forEach(k=>F[k]=[["vals","Dataset values","20, 30, 40, 50","t"]]);
const sum=a=>a.reduce((s,v)=>s+v,0);
function solve(id,f){
 const n=k=>Number(f[k]);
 if(id==="clock"){const h=n("hour"),m=n("minute");if(!Number.isInteger(h)||h<0||h>23||!Number.isInteger(m)||m<0||m>59||f.hour===""||f.minute==="")throw Error("Enter an hour from 0–23 and a minute from 0–59.");
  const hp=(h%12)*30+m*.5,mp=m*6,d=Math.abs(hp-mp);return`Smaller angle: ${Math.min(d,360-d)}°\nHour hand: ${hp}°\nMinute hand: ${mp}°`}
 if(id==="calendar"){const y=n("year"),mo=n("month"),d=n("day"),dt=new Date(y,mo-1,d);if(!(y>0)||dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)throw Error("Enter a valid date.");
  const l=(y%4===0&&y%100!==0)||y%400===0;return`${dt.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}\n${y} is ${l?"a leap year":"not a leap year"} (${l?366:365} days).`}
 if(id==="pattern"){const a=nums(f.seq);if(a.length<3)throw Error("Enter at least three terms.");const d=a.slice(1).map((v,i)=>v-a[i]),L=a[a.length-1];
  if(d.every(v=>v===d[0]))return`Rule: add ${d[0]} each time\nNext term: ${L+d[0]}`;
  const r=a.slice(1).map((v,i)=>a[i]?v/a[i]:NaN);if(r.every(v=>v===r[0]&&isFinite(v)))return`Rule: multiply by ${r[0]} each time\nNext term: ${L*r[0]}`;
  const s=d.slice(1).map((v,i)=>v-d[i]);if(s.length&&s.every(v=>v===s[0]))return`Rule: differences change by ${s[0]} each step\nNext term: ${L+d[d.length-1]+s[0]}`;
  throw Error("No simple pattern found (arithmetic, geometric, or constant second difference).")}
 if(id==="pie"){const a=nums(f.vals),t=sum(a);if(a.some(v=>v<0)||t<=0)throw Error("Use non-negative values with a positive total.");
  return`Total: ${t}\n`+a.map((v,i)=>`Category ${i+1}: ${(v/t*100).toFixed(1)}% = ${(v/t*360).toFixed(1)}°`).join("\n")}
 if(id==="scatter"){const a=nums(f.vals);if(a.length<4||a.length%2)throw Error("Enter an even number of values as x,y pairs (at least 2 pairs).");
  const x=a.filter((_,i)=>!(i%2)),y=a.filter((_,i)=>i%2),mx=sum(x)/x.length,my=sum(y)/y.length;
  const c=sum(x.map((v,i)=>(v-mx)*(y[i]-my))),vx=sum(x.map(v=>(v-mx)**2)),vy=sum(y.map(v=>(v-my)**2));if(!vx||!vy)throw Error("x or y values are all identical, so r is undefined.");
  const r=c/Math.sqrt(vx*vy),s=Math.abs(r)>.6?"Strong":Math.abs(r)>.3?"Moderate":"Weak";return`Pairs: ${x.length}\nCorrelation r = ${r.toFixed(3)}\n${s} ${r>=0?"positive":"negative"} linear association.\nCorrelation does not prove causation.`}
 if(id==="histogram"){const a=nums(f.vals),lo=Math.min(...a),hi=Math.max(...a),b=Math.min(6,Math.max(2,Math.ceil(Math.sqrt(a.length)))),w=(hi-lo||1)/b,c=Array(b).fill(0);
  a.forEach(v=>c[Math.min(b-1,Math.floor((v-lo)/w))]++);return`Classes: ${b}, width ${w.toFixed(2)}\n`+c.map((k,i)=>`${(lo+i*w).toFixed(1)} – ${(lo+(i+1)*w).toFixed(1)}: ${k}`).join("\n")}
 if(id==="missing"){const k=nums(f.known),t=n("total");if(f.total===""||!isFinite(t))throw Error("Enter a numeric total.");return`Sum of known: ${sum(k)}\nMissing value: ${t-sum(k)}`}
 const a=nums(f.vals),t=sum(a),ch=a[a.length-1]-a[0];
 return`Count: ${a.length}\nTotal: ${t}\nAverage: ${(t/a.length).toFixed(2)}\nMin / Max: ${Math.min(...a)} / ${Math.max(...a)}`+(a.length>1?`\nFirst → last change: ${ch}${a[0]?` (${(ch/Math.abs(a[0])*100).toFixed(1)}%)`:""}`:"")}
function preview(id,f){let a=[];try{a=nums(f.vals)}catch(e){}if(!a.length)a=[18,32,25,45,38];

 <div class="row" style="margin-top:0"><button class="btn p" data-a="solve">Calculate</button><button class="btn" data-a="clear">Clear</button></div>
 ${S.out?`<div class="res ${S.out.e?"er":""}">${esc(S.out.t)}</div>`:""}</div>
 <div class="card"><h3>Formula</h3><div class="fm">${m.f}</div><p class="mu sm">${m.c}</p>${preview(m.id,S.form)}</div>`}

function quizHTML(){const s=S.sess;
 if(s.i>=s.qs.length){const p=pct(s.score,s.qs.length);return`<div class="card" style="text-align:center;max-width:520px;margin:auto"><div class="num pu">${p}%</div><h2>${p>=80?"Excellent work!":p>=50?"Good effort!":"Keep practising!"}</h2><p class="mu">You scored ${s.score} out of ${s.qs.length}.</p><div class="row" style="justify-content:center"><button class="btn p" data-a="start" data-v="${s.topic}">Try again</button><button class="btn" data-a="go" data-v="progress">View progress</button></div></div>`}
 const q=s.qs[s.i],d=s.done;
 return`<div class="card" style="max-width:700px;margin:auto"><div style="display:flex;justify-content:space-between" class="sm mu"><span>Question ${s.i+1} of ${s.qs.length}</span><span class="tag">${byId(q.id).n.toUpperCase()}</span></div>
 <div class="pg" style="margin:10px 0 18px"><span style="width:${(s.i+(d?1:0))/s.qs.length*100}%"></span></div><h2>${q.q}</h2>
 ${q.o.map((o,i)=>`<button class="ch ${s.pick===i?"sel":""} ${d&&i===q.a?"ok":""} ${d&&s.pick===i&&i!==q.a?"no":""}" data-a="pick" data-v="${i}" ${d?"disabled":""}><b>${"ABCD"[i]}.</b> ${o}</button>`).join("")}
 ${d?`<div class="tip"><b>${s.pick===q.a?"Correct!":"Not quite."}</b> ${q.w}</div>`:""}
 <div class="row">${d?`<button class="btn p" data-a="next">${s.i+1===s.qs.length?"See results":"Next →"}</button>`:`<button class="btn p" data-a="check" ${s.pick==null?"disabled":""}>Check answer</button>`}<button class="btn" data-a="topic" data-v="${q.id}">Review concept</button></div></div>`}

function view(){
 const [r,t]=tot();
 if(S.page==="home")return`<section class="hero"><span class="tag">YOUR REASONING LAB</span><h1>Train your mind.<br><span class="pu">Master every problem.</span></h1><p>Learn the concept, solve with the calculator, then prove it in practice quizzes. Ten core logic and data interpretation topics in one place.</p>
  <div class="row"><button class="btn p" data-a="go" data-v="learn">Start learning</button><button class="btn" data-a="start" data-v="all">Mixed practice quiz</button></div></section>
  <div class="stats"><div class="card"><span class="mu sm">Topics</span><div class="num">${M.length}</div></div><div class="card"><span class="mu sm">Answered</span><div class="num">${t}</div></div><div class="card"><span class="mu sm">Accuracy</span><div class="num">${pct(r,t)}%</div></div><div class="card"><span class="mu sm">Best streak</span><div class="num">${P.best||0} 🔥</div></div></div>
  <div class="sec"><h2>Popular topics</h2><button class="btn" data-a="go" data-v="learn">View all</button></div><div class="grid">${M.slice(0,4).map(card).join("")}</div>`;
 if(S.page==="learn"){const f=M.filter(m=>(m.n+m.d).toLowerCase().includes(S.q.toLowerCase())&&(S.cat==="ALL"||m.t===S.cat));
  return`<span class="tag">KNOWLEDGE HUB</span><h1>Learn the <span class="pu">logic</span> behind it.</h1><div class="fl" style="max-width:420px;margin-top:16px"><input id="sq" value="${esc(S.q)}" placeholder="Search topics…"></div>
  <div class="chips2">${["ALL","LOGIC","DATA","CHARTS"].map(c=>`<button class="fc ${S.cat===c?"on":""}" data-a="cat" data-v="${c}">${c}</button>`).join("")}</div><div class="grid" id="grid">${f.map(card).join("")||"<p class=mu>No topics found.</p>"}</div>`}
 if(S.page==="topic"){const m=byId(S.id);
  return`<div style="display:flex;gap:14px;align-items:center"><div class="ic" style="width:56px;height:56px;font-size:28px;margin:0">${m.i}</div><div><span class="tag">${m.t} MODULE</span><h1 style="margin:0">${m.n}</h1></div></div><p class="mu">${m.d}</p>
  <div class="tabs">${[["learn","📖 Learn"],["solve","⌘ Solve"],["practice","⚡ Practice"]].map(([k,l])=>`<button class="tb ${S.tab===k?"on":""}" data-a="tab" data-v="${k}">${l}</button>`).join("")}</div>
  ${S.tab==="learn"?`<div class="two"><div class="card"><h2>Core concept</h2><p>${m.c}</p><div class="fm">${m.f}</div><h3>Worked example</h3><p>${m.e}</p><div class="tip">💡 ${m.tp}</div><button class="btn p" data-a="tab" data-v="solve">Try the solver →</button></div>
   <div class="card"><h2>Quick revision</h2><p class="sm">① Identify what is given and what is asked.<br>② Pick the matching formula.<br>③ Calculate, then sanity-check units and totals.</p><button class="btn" data-a="start" data-v="${m.id}">Test my understanding →</button></div></div>`:""}
  ${S.tab==="solve"?`<div class="two">${solver(m)}</div>`:""}
  ${S.tab==="practice"?(S.sess&&S.sess.topic===m.id?quizHTML():`<div class="card"><h2>${m.q.length} practice questions</h2><p class="mu">Instant feedback with explanations.</p><button class="btn p" data-a="start" data-v="${m.id}">Start quiz</button></div>`):""}`}
 if(S.page==="practice"){if(S.sess)return`<span class="tag">PRACTICE ARENA</span><h1>${S.sess.topic==="all"?"Mixed":"Topic"} <span class="pu">quiz</span></h1><div style="margin-top:18px">${quizHTML()}</div>`;
  return`<span class="tag">PRACTICE ARENA</span><h1>Test your <span class="pu">skills.</span></h1><p class="mu">Choose a mixed 10-question quiz or focus on one topic.</p><div class="row"><button class="btn p" data-a="start" data-v="all">Mixed quiz (10 questions)</button></div><div class="sec"><h2>Or pick a topic</h2></div><div class="grid">${M.map(m=>`<button class="card tc" data-a="start" data-v="${m.id}"><div class="ic">${m.i}</div><h3>${m.n}</h3><span class="mu sm">${m.q.length} questions</span></button>`).join("")}</div>`}
 if(S.page==="formulas")return`<span class="tag">CHEAT SHEET</span><h1>Formula <span class="pu">reference.</span></h1><p class="mu">Every key formula and tip, in one place.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-top:18px">${M.map(m=>`<div class="card"><h3>${m.i} ${m.n}</h3><div class="fm">${m.f}</div><p class="mu sm" style="margin:0">💡 ${m.tp}</p></div>`).join("")}</div>`;
 return`<span class="tag">YOUR PROGRESS</span><h1>Learning <span class="pu">dashboard.</span></h1><div class="stats" style="margin-top:18px"><div class="card"><span class="mu sm">XP earned</span><div class="num">${P.xp}</div></div><div class="card"><span class="mu sm">Answered</span><div class="num">${t}</div></div><div class="card"><span class="mu sm">Accuracy</span><div class="num">${pct(r,t)}%</div></div><div class="card"><span class="mu sm">Best streak</span><div class="num">${P.best||0}</div></div></div>
  <div class="card"><h2>Accuracy by topic</h2>${M.map(m=>{const a=P.a[m.id]||[0,0];return`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between" class="sm"><span>${m.i} ${m.n}</span><span class="mu">${a[1]?`${a[0]}/${a[1]} · ${pct(a[0],a[1])}%`:"Not attempted"}</span></div><div class="pg"><span style="width:${pct(a[0],a[1])}%"></span></div></div>`}).join("")}<button class="btn" data-a="reset">Reset progress</button></div>`}
function render(){header();$("#app").innerHTML=`<div class="page">${view()}</div>`}

document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el){if(S.menu&&!e.target.closest(".dd")){S.menu=0;header()}return}
 const a=el.dataset.a,v=el.dataset.v;
 if(a==="menu"){S.menu=!S.menu;return header()}
 if(a==="burger"){S.nav=!S.nav;return header()}
 S.menu=0;S.nav=0;
 if(a==="go"){S.page=v;if(v==="practice")S.sess=null}
 else if(a==="topic"){S.page="topic";S.id=v;S.tab="learn";S.form={};S.out=null;S.sess=null}
 else if(a==="tab"){S.tab=v;S.out=null;if(v==="solve")S.form={}}
 else if(a==="cat")S.cat=v;
 else if(a==="clear"){S.form={};S.out=null}
 else if(a==="solve"){try{S.out={t:solve(S.id,S.form)}}catch(x){S.out={t:x.message,e:1}}}
 else if(a==="start"){let qs=[];const mk=m=>m.q.map(q=>({id:m.id,q:q[0],o:q[1],a:q[2],w:q[3]}));
  if(v==="all"){qs=M.flatMap(mk).sort(()=>Math.random()-.5).slice(0,10);S.page="practice"}else{qs=mk(byId(v)).sort(()=>Math.random()-.5);S.id=v;if(S.page!=="practice"){S.page="topic";S.tab="practice"}}
  S.sess={topic:v,qs,i:0,pick:null,done:0,score:0}}
 else if(a==="pick")S.sess.pick=+v;
 else if(a==="check"){const s=S.sess,q=s.qs[s.i],ok=s.pick===q.a;s.done=1;P.a[q.id]=P.a[q.id]||[0,0];P.a[q.id][1]++;
  if(ok){s.score++;P.a[q.id][0]++;P.xp+=10;P.st++;P.best=Math.max(P.best||0,P.st)}else P.st=0;save()}
 else if(a==="next"){const s=S.sess;s.i++;s.pick=null;s.done=0}
 else if(a==="reset"){if(confirm("Reset all saved progress?")){P={a:{},st:0,xp:0};save()}}
 render();window.scrollTo(0,0)});
document.addEventListener("input",e=>{
 if(e.target.dataset.f){S.form[e.target.dataset.f]=e.target.value;S.out=null}
 if(e.target.id==="sq"){S.q=e.target.value;const f=M.filter(m=>(m.n+m.d).toLowerCase().includes(S.q.toLowerCase())&&(S.cat==="ALL"||m.t===S.cat));$("#grid").innerHTML=f.map(card).join("")||"<p class=mu>No topics found.</p>"}});
render();
</script>
</body>
</html>
